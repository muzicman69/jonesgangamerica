<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#05080a"/>

  <!-- Diamond/field shape -->
  <g transform="translate(256,240)">
    <!-- Outfield green -->
    <ellipse cx="0" cy="40" rx="160" ry="110" fill="#0a2e10" opacity="0.8"/>
    <!-- Infield dirt -->
    <polygon points="0,-120 120,0 0,120 -120,0" fill="#6b3f1a" opacity="0.7"/>
    <!-- Infield grass -->
    <polygon points="0,-96 96,0 0,96 -96,0" fill="#0d3d12" opacity="0.8"/>
    <!-- Base paths -->
    <polygon points="0,-120 120,0 0,120 -120,0" fill="none" stroke="#c8a96a" stroke-width="3" opacity="0.5"/>
    <!-- Bases -->
    <rect x="-10" y="-130" width="20" height="20" rx="3" fill="white" opacity="0.95"/>
    <rect x="110" y="-10" width="20" height="20" rx="3" fill="white" opacity="0.95"/>
    <rect x="-130" y="-10" width="20" height="20" rx="3" fill="white" opacity="0.95"/>
    <rect x="-10" y="110" width="20" height="20" rx="3" fill="white" opacity="0.95"/>
    <!-- Pitcher mound -->
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="#8b5e3c" opacity="0.9"/>
    <!-- Ball -->
    <circle cx="0" cy="-28" r="7" fill="white" opacity="0.9"/>
  </g>

  <!-- LIVE dot -->
  <circle cx="390" cy="122" r="18" fill="#ef4444"/>
  <circle cx="390" cy="122" r="10" fill="white"/>

  <!-- App name -->
  <text x="256" y="450" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="2">DIAMOND</text>
  <text x="256" y="498" font-family="'Arial Black', sans-serif" font-size="34" font-weight="700"
        fill="#00e574" text-anchor="middle" letter-spacing="4">LIVE</text>
</svg>
